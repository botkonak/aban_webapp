{% extends "base.html" %}
{% block content %}
<article class="pub-card article">
  <header class="article-head">
    <h1 class="article-title">{{ page.title }}</h1>
    <div class="article-meta">
      <span>آخرین به‌روزرسانی: {{ page.updated_at_fa }}</span>
    </div>
  </header>
  <div class="prose">
    {{ page.content|safe }}
  </div>
</article>
{% endblock %}
